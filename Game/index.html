<!DOCTYPE html>
<html>
  <head>
    <title>28 Keys Later</title>
    <style type="text/css">
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #2b2b2b;
        overflow: hidden;
      }

      #mainDiv {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* If viewport is too short, pin to top instead of centering */
      @media (max-height: 900px) {
        #mainDiv {
          align-items: flex-start;
        }
      }

      #gameContainer {
        width: 1400px;
        height: 900px;
        background: black;
        overflow: hidden;
      }

      #visitorCounters {
        position: fixed;
        right: 14px;
        bottom: 14px;

        color: #e6e6e6;
        font-family: "Courier New", Courier, monospace;
        font-size: 12px;
        line-height: 1.4;

        background: rgba(0, 0, 0, 0.35);
        padding: 10px 12px;
        border-radius: 6px;

        border: 1px solid rgba(255, 255, 255, 0.08);

        display: none;

        user-select: none;
        pointer-events: none;

        opacity: 0;
        transition: opacity 0.6s ease;
      }

    </style>
  </head>
  <body onload="initialize();">
    <div id="visitorCounters">
      <div id="uniqueCounter">Unique: …</div>
      <div id="totalCounter">Visits: …</div>
    </div>
    <div id="mainDiv">
      <div id="gameContainer"></div>
    </div>
    <script type="text/javascript" charset="utf-8">
      var device = null;
    </script>

    <script src="Source/Libraries/firebase/10.12.0/firebase-app-compat.js"></script>
    <script src="Source/Libraries/firebase/10.12.0/firebase-firestore-compat.js"></script>
    <script src="Source/Libraries/howler.min.js"></script>
    <script src="Source/Libraries/pixi.min.js"></script>
    <script src="Source/Libraries/tween.umd.min.js"></script>

    <script src="Source/Engine/2d_game_utilities.js"></script>
    <script src="Source/Engine/general_utilities.js"></script>
    <script src="Source/Engine/sound.js"></script>
    <script src="Source/Engine/time.js"></script>

    <script src="Source/Game/game.js"></script>
    <script src="Source/Game/game_screen_management.js"></script>
    <script src="Source/Game/visitor_counters.js"></script>

    <script src="Source/Subgame_Elements/config.js"></script>

    <script src="Source/Subgames/typing_game.js"></script>
  </body>
</html>
